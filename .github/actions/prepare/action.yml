name: Prepare the FUTO Keyboard build
description: >
  Run after checkout with submodules on a GitHub-hosted ubuntu-latest machine. Puts JDK 17 on
  the path, pulls the LFS files in every submodule, checks the Gradle wrapper, caches Gradle and
  shows the toolchain.

runs:
  using: composite
  steps:
    # ubuntu-latest ships several JDKs; FUTO builds with 17.
    - name: Use JDK 17
      shell: bash
      run: |
        echo "JAVA_HOME=$JAVA_HOME_17_X64" >> "$GITHUB_ENV"
        echo "$JAVA_HOME_17_X64/bin" >> "$GITHUB_PATH"

    # FUTO's swipe models sit in LFS inside submodules. Without `git lfs install --local` in each
    # submodule, `git lfs pull` skips the checkout and the models ship as 132-byte pointer stubs,
    # which crash the keyboard on the first swipe.
    - name: Fetch large files in submodules
      shell: bash
      run: |
        git lfs install --local && git lfs pull
        git submodule foreach --recursive 'git lfs install --local && git lfs pull'
        stubs=$(grep -rlI --exclude-dir=.git '^version https://git-lfs.github.com/spec/v1' java libs voiceinput-shared || true)
        if [ -n "$stubs" ]; then echo "LFS pointer stubs left in place of real files:"; echo "$stubs"; exit 1; fi

    - name: Check the Gradle wrapper is a real Gradle release
      uses: gradle/actions/wrapper-validation@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2

    # Caches Gradle's downloads and build cache between runs, which saves most of a build's time.
    - name: Cache Gradle
      uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2

    - name: Show the toolchain
      shell: bash
      run: |
        uname -m
        java -version
        echo "ANDROID_HOME=$ANDROID_HOME"
        ls "$ANDROID_HOME/ndk" "$ANDROID_HOME/build-tools" || true
        df -h "$GITHUB_WORKSPACE" | tail -1

# cost: 90 machine-minutes per landing, removed by the owner when the fork stops needing builds
name: Build

# Unit tests and an installable unstable debug APK, on the owner's own runner on the vnic server
# (never GitHub's machines). A pull request runs it once on the tree that will land; a hand start
# runs it on any branch.

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    # Linux ARM64 with JDK 17 and the Android SDK (ANDROID_HOME) preinstalled.
    runs-on: [self-hosted, futo]
    timeout-minutes: 150
    env:
      JAVA_HOME: /usr/lib/jvm/java-17-openjdk-arm64
    steps:
      # This runner keeps its workspace between jobs. The git-lfs hooks and filters that the last
      # job set up would make checkout call git-lfs, which only exists inside a job, so clear them.
      - name: Clear git-lfs setup left by an earlier job
        run: |
          [ -d .git ] || exit 0
          for cfg in .git/config $(find .git/modules -type f -name config -execdir test -f HEAD \; -print 2>/dev/null); do
            git config --file "$cfg" --remove-section filter.lfs 2>/dev/null || true
            git config --file "$cfg" --remove-section lfs 2>/dev/null || true
          done
          find .git -path '*/hooks/*' -type f \( -name post-checkout -o -name post-commit -o -name post-merge -o -name pre-push \) \
            -exec grep -l 'git lfs' {} + | xargs -r rm -f

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          submodules: recursive

      - uses: ./.github/actions/prepare

      # FUTO derives the version from full git history, which a shallow checkout lacks.
      # Only arm64 is built (.github/arm64-only.gradle): the owner's phone is arm64, and each ABI is a full native compile.
      - name: Unit tests and debug APK
        env:
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: personal-${{ github.run_number }}
        run: ./gradlew --no-daemon --continue --init-script .github/arm64-only.gradle testUnstableDebugUnitTest assembleUnstableDebug

      - name: Upload the APK
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: futo-keyboard-unstable-debug-apk
          path: build/outputs/apk/unstable/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload the test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: unit-test-results
          path: build/test-results/
          if-no-files-found: ignore
          retention-days: 7

# cost: 90 machine-minutes per landing, removed by the owner when the fork stops needing builds
name: Build

# Unit tests and an installable unstable debug APK, on the owner's own runners (never GitHub's
# machines). A pull request runs it once on the tree that will land; a hand start runs it on any branch.

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ${{ vars.TEST_RUNNER || 'org-tests' }}
    timeout-minutes: 150
    steps:
      # The runners have no git-lfs; FUTO's swipe model submodule stores its files in LFS.
      - name: Install git-lfs
        run: |
          v=v3.8.1
          case "$(uname -m)" in aarch64) a=arm64 ;; *) a=amd64 ;; esac
          f="git-lfs-linux-$a-$v.tar.gz"
          cd "$RUNNER_TEMP"
          curl -fsSLO "https://github.com/git-lfs/git-lfs/releases/download/$v/$f"
          curl -fsSL "https://github.com/git-lfs/git-lfs/releases/download/$v/sha256sums.asc" | grep "[ *]$f\$" | sha256sum -c -
          tar xzf "$f"
          dirname "$(find "$RUNNER_TEMP" -maxdepth 3 -type f -name git-lfs | head -1)" >> "$GITHUB_PATH"

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          submodules: recursive
          lfs: true

      - name: Fetch large files in submodules
        run: git submodule foreach --recursive 'git lfs pull || true'

      - name: Set up JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Check the Gradle wrapper is a real Gradle release
        uses: gradle/actions/wrapper-validation@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2

      # The NDK's compiler is an x86-64 program; on these ARM runners it runs under emulation
      # and needs an x86-64 zlib, which the runners lack.
      - name: x86-64 zlib for the NDK compiler
        run: |
          d="$RUNNER_TEMP/x86-64-zlib"
          f=zlib1g_1.3.dfsg-3.1ubuntu2.3_amd64.deb
          curl -fsSL -o "$RUNNER_TEMP/$f" "http://archive.ubuntu.com/ubuntu/pool/main/z/zlib/$f"
          echo "376249c8de139568221dbb242318cc8cb8f02299e3a62b7432948e1754fbddf9  $RUNNER_TEMP/$f" | sha256sum -c -
          dpkg-deb -x "$RUNNER_TEMP/$f" "$d"
          echo "X86_64_LIBS=$d/usr/lib/x86_64-linux-gnu" >> "$GITHUB_ENV"

      # FUTO derives the version from full git history, which a shallow checkout lacks.
      # Only arm64 is built: the owner's phone is arm64, and each ABI is a full native compile.
      - name: Unit tests and debug APK
        env:
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: personal-${{ github.run_number }}
        run: |
          export LD_LIBRARY_PATH="$X86_64_LIBS${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          ./gradlew --no-daemon --continue -Pandroid.injected.build.abi=arm64-v8a testUnstableDebugUnitTest assembleUnstableDebug

      - name: Upload the APK
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: futo-keyboard-unstable-debug-apk
          # A build limited to one ABI writes its APK under intermediates, not outputs.
          path: |
            build/outputs/apk/unstable/debug/*.apk
            build/intermediates/apk/unstable/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload the test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: unit-test-results
          path: build/test-results/
          if-no-files-found: ignore
          retention-days: 7

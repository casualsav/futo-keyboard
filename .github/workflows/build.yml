# cost: free (public repository on GitHub-hosted runners), about 30 minutes a run
name: Build

# Unit tests and an installable unstable debug APK, on GitHub's ubuntu-latest machines. A pull
# request runs it once on the tree that will land; a hand start runs it on any branch.

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          submodules: recursive

      - uses: ./.github/actions/prepare

      # FUTO derives the version from full git history, which a shallow checkout lacks.
      # Only arm64 is built (.github/arm64-only.gradle): the owner's phone is arm64, and each ABI is a full native compile.
      - name: Unit tests and debug APK
        env:
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: personal-${{ github.run_number }}
        run: ./gradlew --no-daemon --continue --init-script .github/arm64-only.gradle testUnstableDebugUnitTest assembleUnstableDebug

      - name: Upload the APK
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: futo-keyboard-unstable-debug-apk
          path: build/outputs/apk/unstable/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload the test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: unit-test-results
          path: build/test-results/
          if-no-files-found: ignore
          retention-days: 7

# cost: 40 machine-minutes per landing, removed by the owner when the fork stops needing builds
name: Build

# Unit tests and an installable unstable debug APK, on the owner's own runners (never GitHub's
# machines). A pull request runs it once on the tree that will land; a hand start runs it on any branch.

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ${{ vars.TEST_RUNNER || 'org-tests' }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          submodules: recursive
          lfs: true

      - name: Fetch large files in submodules
        run: git submodule foreach --recursive 'git lfs pull || true'

      - name: Set up JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Check the Gradle wrapper is a real Gradle release
        uses: gradle/actions/wrapper-validation@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2

      - name: Unit tests and debug APK
        run: ./gradlew --no-daemon --continue testUnstableDebugUnitTest assembleUnstableDebug

      - name: Upload the APK
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: futo-keyboard-unstable-debug-apk
          path: build/outputs/apk/unstable/debug/*.apk
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload the test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: unit-test-results
          path: build/test-results/
          if-no-files-found: ignore
          retention-days: 7

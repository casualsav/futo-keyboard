# cost: free (public repository on GitHub-hosted runners), about 30 minutes per landing on main
name: Release

# Builds the unstable release APK on GitHub's ubuntu-latest machines and publishes it as the
# next "personal-N" GitHub release. Runs on every landing on main, or by hand. A pull request
# from this repository that changes the release setup runs the same signed build as a dry run,
# without publishing, so the signing is proven before it lands. Pull requests from forks get no
# secrets, so their dry run stops at the signing step.
#
# Signing: with the owner's private key (alias futo), kept as two encrypted repository secrets:
# SIGNING_KEYSTORE_BASE64 (the keystore file, base64) and SIGNING_PASSWORD. The key is written to
# the job's temp directory for the build and deleted at the end. If either secret is missing the
# job stops, rather than falling back to the public debug key.

on:
  push:
    branches: [main]
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/release.yml
      - .github/actions/**
      - .github/scripts/**
      - .github/arm64-only.gradle
      - build.gradle

concurrency:
  group: release-${{ github.event_name }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      SIGNING_ALIAS: futo
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          submodules: recursive

      - uses: ./.github/actions/prepare

      - name: Pick the release number
        id: number
        run: echo "n=$(python3 -I .github/scripts/publish-release.py next-number)" >> "$GITHUB_OUTPUT"

      # build.gradle signs release builds with keystore.properties when it exists. It is written
      # only for this job (it is in .gitignore) and removed in the last step, whatever happens.
      - name: Point the build at the private signing key
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
        run: |
          if [ -z "$SIGNING_KEYSTORE_BASE64" ]; then
            echo "::error::The SIGNING_KEYSTORE_BASE64 repository secret is not set. Add the keystore, base64-encoded, under Settings > Secrets and variables > Actions, then re-run."
            exit 1
          fi
          if [ -z "$SIGNING_PASSWORD" ]; then
            echo "::error::The SIGNING_PASSWORD repository secret is not set. Add it under Settings > Secrets and variables > Actions, then re-run."
            exit 1
          fi
          export SIGNING_KEYSTORE="$RUNNER_TEMP/release.jks"
          (umask 077 && printf '%s' "$SIGNING_KEYSTORE_BASE64" | base64 -d > "$SIGNING_KEYSTORE") || {
            echo "::error::SIGNING_KEYSTORE_BASE64 is not valid base64."
            exit 1
          }
          if ! keytool -list -keystore "$SIGNING_KEYSTORE" -alias "$SIGNING_ALIAS" -storepass:env SIGNING_PASSWORD >/dev/null; then
            echo "::error::The keystore in SIGNING_KEYSTORE_BASE64 could not be opened with SIGNING_PASSWORD and alias $SIGNING_ALIAS."
            exit 1
          fi
          echo "SIGNING_KEYSTORE=$SIGNING_KEYSTORE" >> "$GITHUB_ENV"
          python3 -I - <<'PY'
          import os
          def esc(v):
              return v.replace("\\", "\\\\").replace("\n", "\\n").replace("=", "\\=").replace(":", "\\:").replace("#", "\\#").replace("!", "\\!").replace(" ", "\\ ")
          pw = esc(os.environ["SIGNING_PASSWORD"])
          fd = os.open("keystore.properties", os.O_WRONLY | os.O_CREAT | os.O_TRUNC, 0o600)
          with os.fdopen(fd, "w") as f:
              f.write(f"storeFile={esc(os.environ['SIGNING_KEYSTORE'])}\n")
              f.write(f"keyAlias={esc(os.environ['SIGNING_ALIAS'])}\n")
              f.write(f"storePassword={pw}\nkeyPassword={pw}\n")
          PY

      # Only arm64 is built (.github/arm64-only.gradle). The version code is 1000 + N, so a
      # release always installs over the debug builds from pull requests (which use the run number).
      - name: Release APK
        env:
          N: ${{ steps.number.outputs.n }}
        run: |
          export VERSION_CODE=$((1000 + N)) VERSION_NAME="personal-$N"
          ./gradlew --no-daemon --init-script .github/arm64-only.gradle assembleUnstableRelease

      - name: Check the APK is signed with the private key
        id: apk
        env:
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
        run: |
          apk=$(ls build/outputs/apk/unstable/release/*.apk | grep -v -- '-unsigned' | head -1)
          if [ -z "$apk" ]; then echo "::error::No signed release APK was built"; ls build/outputs/apk/unstable/release/; exit 1; fi
          apksigner=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)apksigner
          echo "Checking $apk with $apksigner"
          certs=$("$apksigner" verify --print-certs "$apk")
          printf '%s\n' "$certs" | grep 'certificate SHA-256 digest' || true
          # Newer apksigner prints "Signer (minSdkVersion=..., ...)" instead of "Signer #1"; every signer must be the private key.
          signed=$(printf '%s\n' "$certs" | sed -n 's/^Signer.* certificate SHA-256 digest: //p' | sort -u)
          expected=$(keytool -list -v -keystore "$SIGNING_KEYSTORE" -alias "$SIGNING_ALIAS" -storepass:env SIGNING_PASSWORD | sed -n 's/^[[:space:]]*SHA256: //p' | tr -d ':' | tr 'A-F' 'a-f')
          if [ -z "$signed" ] || [ "$signed" != "$expected" ]; then
            echo "::error::The APK is not signed with the private key (APK: $signed, key: $expected)."
            exit 1
          fi
          echo "Signed with the private key, certificate SHA-256 $signed"
          echo "path=$apk" >> "$GITHUB_OUTPUT"

      - name: Publish the release
        if: ${{ github.event_name != 'pull_request' }}
        run: |
          body="$(git log -1 --format=%s)

          Release build, signed with your private key."
          python3 -I .github/scripts/publish-release.py publish "${{ steps.number.outputs.n }}" "${{ steps.apk.outputs.path }}" "$body"

      - name: Remove the signing config
        if: ${{ always() }}
        run: rm -f keystore.properties "$RUNNER_TEMP/release.jks"

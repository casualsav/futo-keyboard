# cost: about 30 machine-minutes per landing on main, on the owner's runner
name: Release

# Builds the unstable release APK on the owner's own runner on the vnic server (never GitHub's
# machines) and publishes it as the next "personal-N" GitHub release. Runs on every landing on
# main, or by hand.
#
# Signing: with the owner's private key, which lives only on the runner at
# /home/gh-futo/keys/release.jks (alias futo); its password is the SIGNING_PASSWORD secret. The
# key file is never committed or uploaded. If the file or the secret is missing the job stops,
# rather than falling back to the public debug key.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    # Linux ARM64 with JDK 17 and the Android SDK (ANDROID_HOME) preinstalled.
    runs-on: [self-hosted, futo]
    timeout-minutes: 150
    env:
      JAVA_HOME: /usr/lib/jvm/java-17-openjdk-arm64
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      SIGNING_KEYSTORE: /home/gh-futo/keys/release.jks
      SIGNING_ALIAS: futo
    steps:
      # This runner keeps its workspace between jobs. The git-lfs hooks and filters that the last
      # job set up would make checkout call git-lfs, which only exists inside a job, so clear them.
      - name: Clear git-lfs setup left by an earlier job
        run: |
          [ -d .git ] || exit 0
          for cfg in .git/config $(find .git/modules -type f -name config -execdir test -f HEAD \; -print 2>/dev/null); do
            git config --file "$cfg" --remove-section filter.lfs 2>/dev/null || true
            git config --file "$cfg" --remove-section lfs 2>/dev/null || true
          done
          find .git -path '*/hooks/*' -type f \( -name post-checkout -o -name post-commit -o -name post-merge -o -name pre-push \) \
            -exec grep -l 'git lfs' {} + | xargs -r rm -f

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          submodules: recursive

      - uses: ./.github/actions/prepare

      - name: Pick the release number
        id: number
        run: echo "n=$(python3 -I .github/scripts/publish-release.py next-number)" >> "$GITHUB_OUTPUT"

      # build.gradle signs release builds with keystore.properties when it exists. It is written
      # only for this job (it is in .gitignore) and removed in the last step, whatever happens.
      - name: Point the build at the private signing key
        env:
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
        run: |
          if [ ! -f "$SIGNING_KEYSTORE" ]; then
            echo "::error::The signing key $SIGNING_KEYSTORE is missing on the runner. Create it with keytool (alias $SIGNING_ALIAS), then re-run."
            exit 1
          fi
          if [ -z "$SIGNING_PASSWORD" ]; then
            echo "::error::The SIGNING_PASSWORD repository secret is not set. Add it under Settings > Secrets and variables > Actions, then re-run."
            exit 1
          fi
          if ! keytool -list -keystore "$SIGNING_KEYSTORE" -alias "$SIGNING_ALIAS" -storepass:env SIGNING_PASSWORD >/dev/null; then
            echo "::error::The key in $SIGNING_KEYSTORE could not be opened with SIGNING_PASSWORD and alias $SIGNING_ALIAS."
            exit 1
          fi
          python3 -I - <<'PY'
          import os
          def esc(v):
              return v.replace("\\", "\\\\").replace("\n", "\\n").replace("=", "\\=").replace(":", "\\:").replace("#", "\\#").replace("!", "\\!").replace(" ", "\\ ")
          pw = esc(os.environ["SIGNING_PASSWORD"])
          fd = os.open("keystore.properties", os.O_WRONLY | os.O_CREAT | os.O_TRUNC, 0o600)
          with os.fdopen(fd, "w") as f:
              f.write(f"storeFile={esc(os.environ['SIGNING_KEYSTORE'])}\n")
              f.write(f"keyAlias={esc(os.environ['SIGNING_ALIAS'])}\n")
              f.write(f"storePassword={pw}\nkeyPassword={pw}\n")
          PY

      # Only arm64 is built (.github/arm64-only.gradle). The version code is 1000 + N, so a
      # release always installs over the debug builds from pull requests (which use the run number).
      - name: Release APK
        env:
          N: ${{ steps.number.outputs.n }}
        run: |
          export VERSION_CODE=$((1000 + N)) VERSION_NAME="personal-$N"
          ./gradlew --no-daemon --init-script .github/arm64-only.gradle assembleUnstableRelease

      - name: Check the APK is signed with the private key
        id: apk
        env:
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
        run: |
          apk=$(ls build/outputs/apk/unstable/release/*.apk | grep -v -- '-unsigned' | head -1)
          if [ -z "$apk" ]; then echo "::error::No signed release APK was built"; ls build/outputs/apk/unstable/release/; exit 1; fi
          signed=$("$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs "$apk" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p')
          expected=$(keytool -list -v -keystore "$SIGNING_KEYSTORE" -alias "$SIGNING_ALIAS" -storepass:env SIGNING_PASSWORD | sed -n 's/^[[:space:]]*SHA256: //p' | tr -d ':' | tr 'A-F' 'a-f')
          if [ -z "$signed" ] || [ "$signed" != "$expected" ]; then
            echo "::error::The APK is not signed with the private key (APK: $signed, key: $expected)."
            exit 1
          fi
          echo "Signed with the private key, certificate SHA-256 $signed"
          echo "path=$apk" >> "$GITHUB_OUTPUT"

      - name: Publish the release
        run: |
          body="$(git log -1 --format=%s)

          Release build, signed with your private key."
          python3 -I .github/scripts/publish-release.py publish "${{ steps.number.outputs.n }}" "${{ steps.apk.outputs.path }}" "$body"

      - name: Remove the signing config
        if: ${{ always() }}
        run: rm -f keystore.properties
